
name: RaceDay API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.API.slnx

      - name: Build solution
        run: dotnet build RaceDay.API.slnx --configuration Release --no-restore

      
     
      - name: Run tests
        env:
          Jwt__Key: "RaceDayTestOnlySigningKey-12345678901234567890"
          Jwt__Issuer: "RaceDayTestIssuer"
          Jwt__Audience: "RaceDayTestAudience"
        run: dotnet test RaceDay.API.slnx --configuration Release --no-build --logger "console;verbosity=normal"

