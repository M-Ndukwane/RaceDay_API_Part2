

name: RaceDay API and MVC CI

on:
  push:
    branches: [main, part-3]
  pull_request:
    branches: [main, part-3]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Restore API dependencies
      - name: Restore API dependencies
        run: dotnet restore RaceDay.API/RaceDay.API.csproj

      # Restore MVC dependencies
      - name: Restore MVC dependencies
        run: dotnet restore RaceDay.MVC/RaceDay.MVC.csproj

      # Build API
      - name: Build RaceDay API
        run: dotnet build RaceDay.API/RaceDay.API.csproj --configuration Release --no-restore

      # Build MVC
      - name: Build RaceDay MVC
        run: dotnet build RaceDay.MVC/RaceDay.MVC.csproj --configuration Release --no-restore

      # Run existing tests
      - name: Run tests
        env:
          Jwt__Key: "RaceDayTestOnlySigningKey-12345678901234567890"
          Jwt__Issuer: "RaceDayTestIssuer"
          Jwt__Audience: "RaceDayTestAudience"
        run: dotnet test RaceDay.API.slnx --configuration Release --no-restore --logger "console;verbosity=normal"
